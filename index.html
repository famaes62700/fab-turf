<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PMU Direct</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .bg-pmu-dark { background-color: #0c0c10; }
        .text-pmu-green { color: #00965e; }
        .bg-pmu-green { background-color: #00965e; }
    </style>
</head>
<body class="bg-pmu-dark text-slate-100 min-h-screen flex flex-col font-sans">

    <header class="bg-zinc-900 border-b border-zinc-800 p-4 sticky top-0 z-50 shadow-md">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <div class="flex items-center space-x-2">
                <i class="fa-solid fa-horse-head text-pmu-green text-2xl"></i>
                <h1 class="text-xl font-black tracking-wider uppercase">PMU <span class="text-pmu-green">Direct</span></h1>
            </div>
            <div class="flex items-center space-x-2 bg-zinc-800 px-3 py-1.5 rounded-lg border border-zinc-700">
                <i class="fa-regular fa-calendar text-emerald-400"></i>
                <input type="date" id="raceDate" class="bg-transparent text-white text-sm focus:outline-none cursor-pointer">
            </div>
        </div>
    </header>

    <main class="flex-grow max-w-4xl w-full mx-auto p-4 space-y-6">
        <div id="statusAlert" class="bg-zinc-900/90 border border-zinc-800 p-3 rounded-xl text-xs flex items-center justify-between">
            <span id="statusText" class="flex items-center text-zinc-300 font-mono">
                <i class="fa-solid fa-spinner fa-spin text-amber-400 mr-2"></i> Connexion au PMU...
            </span>
            <button onclick="loadLivePmu()" class="text-emerald-400 hover:underline font-semibold ml-2"><i class="fa-solid fa-rotate"></i> Actualiser</button>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div class="bg-zinc-900/90 border border-zinc-800 p-4 rounded-xl shadow">
                <label class="block text-xs font-bold uppercase text-zinc-400 mb-2">1. Hippodrome / Réunion</label>
                <select id="meetingSelect" onchange="onMeetingChange()" class="w-full bg-zinc-800 border border-zinc-700 rounded-lg p-2.5 text-sm text-white focus:outline-none focus:border-emerald-500">
                    <option value="">Chargement...</option>
                </select>
            </div>
            <div class="bg-zinc-900/90 border border-zinc-800 p-4 rounded-xl shadow">
                <label class="block text-xs font-bold uppercase text-zinc-400 mb-2">2. Course du Jour</label>
                <select id="raceSelect" onchange="onRaceChange()" class="w-full bg-zinc-800 border border-zinc-700 rounded-lg p-2.5 text-sm text-white focus:outline-none focus:border-emerald-500">
                    <option value="">Choisissez une réunion</option>
                </select>
            </div>
        </div>

        <div class="bg-gradient-to-r from-emerald-900/40 via-zinc-900 to-zinc-900 border-2 border-pmu-green/50 rounded-2xl p-5 shadow-xl relative overflow-hidden">
            <div class="absolute top-0 right-0 bg-pmu-green text-white text-xs font-extrabold px-3 py-1 rounded-bl-xl uppercase tracking-wider">
                <i class="fa-solid fa-crosshairs mr-1"></i> Simple Gagnant
            </div>
            <h2 class="text-sm font-bold uppercase tracking-wider text-pmu-green mb-3 flex items-center">
                <i class="fa-solid fa-star mr-2"></i> Nos 2 Chevaux Clés
            </h2>
            <div id="topSelections" class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div class="bg-zinc-800/90 border border-pmu-green/40 p-3.5 rounded-xl flex items-center space-x-3">
                    <div class="w-10 h-10 rounded-full bg-emerald-500/20 border border-pmu-green flex items-center justify-center font-black text-pmu-green text-lg">1er</div>
                    <div>
                        <div class="text-xs text-zinc-400 font-medium">Favori Prioritaire</div>
                        <div id="top1Name" class="font-bold text-white text-base">En attente...</div>
                        <div id="top1Stats" class="text-xs text-emerald-400">--</div>
                    </div>
                </div>
                <div class="bg-zinc-800/90 border border-zinc-600 p-3.5 rounded-xl flex items-center space-x-3">
                    <div class="w-10 h-10 rounded-full bg-zinc-700 border border-zinc-500 flex items-center justify-center font-black text-zinc-300 text-lg">2ème</div>
                    <div>
                        <div class="text-xs text-zinc-400 font-medium">Challenger Direct</div>
                        <div id="top2Name" class="font-bold text-white text-base">En attente...</div>
                        <div id="top2Stats" class="text-xs text-zinc-300">--</div>
                    </div>
                </div>
            </div>
        </div>

        <div class="bg-zinc-900/90 border border-zinc-800 rounded-2xl shadow overflow-hidden">
            <div class="p-4 border-b border-zinc-800 flex justify-between items-center">
                <h3 class="font-bold text-sm uppercase tracking-wider text-zinc-300 flex items-center">
                    <i class="fa-solid fa-chart-line mr-2 text-pmu-green"></i> Partants & Musiques Officielles PMU
                </h3>
                <span id="raceInfoDetails" class="text-xs text-zinc-400 bg-zinc-800 px-2.5 py-1 rounded-full">--</span>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse text-sm">
                    <thead>
                        <tr class="bg-zinc-800/60 text-zinc-400 text-xs uppercase border-b border-zinc-800">
                            <th class="p-3">N° / Cheval</th>
                            <th class="p-3">Musique / Forme</th>
                            <th class="p-3">Cote Est.</th>
                            <th class="p-3">Score Algorithmique (%)</th>
                        </tr>
                    </thead>
                    <tbody id="runnersTableBody" class="divide-y divide-zinc-800/60">
                        <tr><td colspan="4" class="p-6 text-center text-zinc-500 italic">Veuillez sélectionner une course ci-dessus.</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script>
        document.getElementById('raceDate').valueAsDate = new Date();
        document.getElementById('raceDate').addEventListener('change', loadLivePmu);

        let liveMeetingsData = [];

        async function loadLivePmu() {
            const dateInput = document.getElementById('raceDate').value;
            const statusText = document.getElementById('statusText');
            statusText.innerHTML = '<span class="text-amber-400"><i class="fa-solid fa-spinner fa-spin mr-2"></i>Chargement du programme PMU...</span>';

            const parts = dateInput.split('-');
            const ddmmyyyy = `${parts[2]}${parts[1]}${parts[0]}`;

            try {
                const response = await fetch(`/api/courses?date=${ddmmyyyy}`);
                
                if (!response.ok) {
                    const errJson = await response.json().catch(() => ({}));
                    throw new Error(errJson.error || "Erreur de réponse du serveur");
                }

                const data = await response.json();

                if (data && data.programme && data.programme.reunions && data.programme.reunions.length > 0) {
                    liveMeetingsData = data.programme.reunions;
                    populateMeetingsSelect(liveMeetingsData);
                    statusText.innerHTML = `<span class="text-emerald-400"><i class="fa-solid fa-check mr-2"></i>Programme en direct chargé (${liveMeetingsData.length} réunions)</span>`;
                } else {
                    throw new Error("Aucune réunion disponible pour cette date.");
                }
            } catch (err) {
                console.error(err);
                statusText.innerHTML = `<span class="text-red-400 font-bold"><i class="fa-solid fa-triangle-exclamation mr-2"></i>${err.message}</span>`;
                clearDisplay();
            }
        }

        function populateMeetingsSelect(reunions) {
            const select = document.getElementById('meetingSelect');
            select.innerHTML = '<option value="">-- Choisissez un hippodrome --</option>';

            reunions.forEach((r, idx) => {
                const opt = document.createElement('option');
                opt.value = idx;
                opt.textContent = `R${r.numOfficiel || (idx+1)} - ${r.hippodrome ? r.hippodrome.libelleLong : 'Hippodrome'} (${r.courses ? r.courses.length : 0} courses)`;
                select.appendChild(opt);
            });
            document.getElementById('raceSelect').innerHTML = '<option value="">Choisissez une réunion</option>';
            clearDisplay();
        }

        function onMeetingChange() {
            const mIdx = document.getElementById('meetingSelect').value;
            const raceSelect = document.getElementById('raceSelect');
            raceSelect.innerHTML = '<option value="">-- Choisissez une course --</option>';
            clearDisplay();

            if (mIdx === "") return;

            const meeting = liveMeetingsData[mIdx];
            if (meeting && meeting.courses) {
                meeting.courses.forEach((c, cIdx) => {
                    const opt = document.createElement('option');
                    opt.value = cIdx;
                    opt.textContent = `Course ${c.numOrdre || (cIdx+1)} : ${c.libelle || 'Prix'} (${c.discipline || 'Trot'})`;
                    raceSelect.appendChild(opt);
                });
            }
        }

        async function onRaceChange() {
            const mIdx = document.getElementById('meetingSelect').value;
            const rIdx = document.getElementById('raceSelect').value;

            if (mIdx === "" || rIdx === "") return clearDisplay();

            const meeting = liveMeetingsData[mIdx];
            const race = meeting.courses[rIdx];

            const dateInput = document.getElementById('raceDate').value;
            const parts = dateInput.split('-');
            const ddmmyyyy = `${parts[2]}${parts[1]}${parts[0]}`;

            const rNum = meeting.numOfficiel || (parseInt(mIdx) + 1);
            const cNum = race.numOrdre || (parseInt(rIdx) + 1);

            const statusText = document.getElementById('statusText');
            statusText.innerHTML = '<span class="text-amber-400"><i class="fa-solid fa-spinner fa-spin mr-2"></i>Chargement des partants officiels...</span>';

            try {
                const response = await fetch(`/api/courses?date=${ddmmyyyy}&r=${rNum}&c=${cNum}`);
                if (!response.ok) throw new Error("Impossible de charger les partants");

                const data = await response.json();
                let partants = data.participants || data || [];

                if (Array.isArray(partants) && partants.length > 0) {
                    processRaceData(partants, race);
                    statusText.innerHTML = `<span class="text-emerald-400"><i class="fa-solid fa-check mr-2"></i>${partants.length} partants officiels chargés !</span>`;
                } else {
                    throw new Error("Aucun partant répertorié pour cette course.");
                }
            } catch (err) {
                console.error(err);
                statusText.innerHTML = `<span class="text-red-400 font-bold"><i class="fa-solid fa-triangle-exclamation mr-2"></i>${err.message}</span>`;
                clearDisplay();
            }
        }

        function processRaceData(partants, race) {
            let processed = partants.map((p, idx) => {
                let musique = p.musique || p.form || "0p";
                let rawCote = (p.dernierRapportDirect && p.dernierRapportDirect.rapport) 
                              ? p.dernierRapportDirect.rapport 
                              : (p.probabiliteEvolution ? p.probabiliteEvolution : "--");

                // Conversion numérique de la cote
                let numCote = parseFloat(String(rawCote).replace(',', '.'));
                if (isNaN(numCote) || numCote <= 0) numCote = 20.0;

                return {
                    num: p.numPmu || p.numOrdre || (idx+1),
                    nom: p.nom || "Cheval",
                    musique: musique,
                    coteDisplay: rawCote !== "--" ? rawCote : numCote.toFixed(1),
                    numCote: numCote,
                    score: calculateScore(musique, numCote)
                };
            });

            // Tri par score algorithmique décroissant
            processed.sort((a, b) => b.score - a.score);

            if (processed.length >= 2) {
                document.getElementById('top1Name').textContent = `${processed[0].num}. ${processed[0].nom}`;
                document.getElementById('top1Stats').textContent = `Score : ${processed[0].score}% | Cote : ${processed[0].coteDisplay}`;

                document.getElementById('top2Name').textContent = `${processed[1].num}. ${processed[1].nom}`;
                document.getElementById('top2Stats').textContent = `Score : ${processed[1].score}% | Cote : ${processed[1].coteDisplay}`;
            }

            displayTable(processed, race);
        }

        function calculateScore(musique, cote) {
            // 1. Composante Cote PMU (65% du poids) : Plus la cote est basse, plus le score de marché est fort
            let coteScore = 0;
            if (cote <= 2.5) coteScore = 95;
            else if (cote <= 5.0) coteScore = 85;
            else if (cote <= 8.0) coteScore = 75;
            else if (cote <= 12.0) coteScore = 60;
            else if (cote <= 20.0) coteScore = 40;
            else if (cote <= 40.0) coteScore = 20;
            else coteScore = 10; // Pour les cotes > 40/1 (outsiders très lointains)

            // 2. Composante Musique (35% du poids) : Analyse des 4 dernières sorties
            let musiqueScore = 40;
            const numbers = musique.match(/\d+/g);
            if (numbers && numbers.length > 0) {
                let pts = 0;
                let count = Math.min(numbers.length, 4);
                for (let i = 0; i < count; i++) {
                    let val = parseInt(numbers[i], 10);
                    if (val === 1) pts += 10;      // 1er
                    else if (val === 2) pts += 8; // 2ème
                    else if (val === 3) pts += 6; // 3ème
                    else if (val === 4 || val === 5) pts += 4;
                    else if (val === 0) pts += 0; // Non placé
                    else pts += 1;
                }
                musiqueScore = (pts / count) * 10; // Note sur 100
            }

            // Calcul combiné du score final (65% Cote + 35% Musique)
            let finalScore = (coteScore * 0.65) + (musiqueScore * 0.35);
            return Math.min(98, Math.max(12, Math.round(finalScore)));
        }

        function displayTable(participants, race) {
            const tbody = document.getElementById('runnersTableBody');
            tbody.innerHTML = '';
            document.getElementById('raceInfoDetails').textContent = `${race.discipline || 'Plat'} — ${race.distance ? race.distance + 'm' : ''}`;

            participants.forEach((p, idx) => {
                const tr = document.createElement('tr');
                if (idx === 0) tr.className = "bg-emerald-500/10 font-semibold border-l-4 border-pmu-green";
                else if (idx === 1) tr.className = "bg-zinc-800/40 border-l-4 border-zinc-500";

                tr.innerHTML = `
                    <td class="p-3 font-medium"><span class="text-emerald-400 mr-2 font-bold">${p.num}</span>${p.nom}</td>
                    <td class="p-3 font-mono text-xs text-zinc-300">${p.musique}</td>
                    <td class="p-3 font-bold text-emerald-400">${p.coteDisplay}</td>
                    <td class="p-3 font-bold text-white">${p.score}%</td>
                `;
                tbody.appendChild(tr);
            });
        }

        function clearDisplay() {
            document.getElementById('top1Name').textContent = 'En attente...';
            document.getElementById('top1Stats').textContent = '--';
            document.getElementById('top2Name').textContent = 'En attente...';
            document.getElementById('top2Stats').textContent = '--';
            document.getElementById('runnersTableBody').innerHTML = '<tr><td colspan="4" class="p-6 text-center text-zinc-500 italic">Veuillez sélectionner une course ci-dessus.</td></tr>';
            document.getElementById('raceInfoDetails').textContent = '--';
        }

        window.onload = loadLivePmu;
    </script>
</body>
</html>

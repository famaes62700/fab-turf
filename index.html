<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Turf - V115 Screener Pro (V27 Le Radar)</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Turf Radar">
    
    <link rel="apple-touch-icon" href="https://ui-avatars.com/api/?name=Radar&background=000&color=0ea5e9&size=512&font-size=0.4&v=54">
    <link rel="icon" type="image/png" href="https://ui-avatars.com/api/?name=Radar&background=000&color=0ea5e9&size=512&font-size=0.4&v=54">

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
        .bg-cyber { background: linear-gradient(145deg, #09090b 0%, #18181b 100%); }
    </style>
</head>
<body class="bg-zinc-950 text-slate-100 min-h-screen flex flex-col font-sans select-none pb-40">

    <div id="toastContainer" class="fixed bottom-24 right-4 z-[9999] flex flex-col space-y-2 pointer-events-none"></div>

    <header class="bg-zinc-900/90 backdrop-blur-md border-b border-zinc-800 p-3 sm:p-4 sticky top-0 z-40 shadow-lg">
        <div class="max-w-3xl mx-auto flex justify-between items-center">
            <div class="flex items-center space-x-2">
                <h1 class="text-base sm:text-lg font-black uppercase tracking-wider text-sky-500 flex items-center bg-zinc-800/80 px-3 py-1.5 rounded-xl border border-zinc-700">
                    <i class="fa-solid fa-satellite-dish mr-2"></i><span class="hidden sm:inline">Turf</span> 
                    <span class="text-[9px] ml-2 bg-sky-500/20 text-sky-400 border border-sky-500/40 px-1.5 py-0.5 rounded font-bold">V27 SCREENER</span>
                </h1>
                <input type="date" id="raceDate" class="bg-zinc-800 text-white text-[11px] sm:text-xs px-2.5 py-1.5 rounded-xl border border-zinc-700 cursor-pointer focus:outline-none focus:border-sky-500 shadow" onchange="onDateChange()">
            </div>
            
            <div class="flex items-center space-x-1.5 sm:space-x-2">
                <button onclick="resetAllCache()" class="bg-zinc-800 hover:bg-zinc-700 text-zinc-300 w-8 h-8 rounded-lg border border-zinc-700 font-bold transition flex items-center justify-center shadow flex-shrink-0 cursor-pointer" title="Vider le cache / Actualiser">
                    <i class="fa-solid fa-arrows-rotate"></i>
                </button>
            </div>
        </div>
    </header>

    <main class="flex-grow max-w-3xl w-full mx-auto p-4 space-y-4">
        
        <!-- FILTRES -->
        <div class="bg-zinc-900 border border-zinc-800 rounded-xl p-2 flex items-center justify-between text-xs">
            <span class="text-zinc-400 font-bold ml-2"><i class="fa-solid fa-filter mr-1.5 text-sky-500"></i> Mode d'Analyse :</span>
            <div class="flex space-x-2">
                <button id="btnFilterGalop" onclick="setDisciplineMode('GALOP')" class="bg-sky-600 text-white px-3 py-1.5 rounded-lg font-black transition shadow cursor-pointer">
                    Galop/Obs
                </button>
                <button id="btnFilterTrot" onclick="setDisciplineMode('TROT')" class="bg-zinc-800 text-zinc-400 hover:text-white px-3 py-1.5 rounded-lg font-bold transition cursor-pointer">
                    Trot
                </button>
                <button id="btnFilterAll" onclick="setDisciplineMode('ALL')" class="bg-zinc-800 text-zinc-400 hover:text-white px-3 py-1.5 rounded-lg font-bold transition cursor-pointer">
                    Mixte
                </button>
            </div>
        </div>

        <!-- STATUT CONNEXION -->
        <div class="flex flex-wrap justify-between items-center gap-2 bg-zinc-950 border border-zinc-800 p-2 rounded-xl">
            <div id="statusText" class="text-xs text-sky-400 font-mono flex items-center">
                <i class="fa-solid fa-spinner fa-spin mr-2"></i>Connexion à l'API Locale...
            </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
            <select id="meetingSelect" onchange="onMeetingChange()" class="w-full bg-zinc-900 border border-zinc-800 rounded-xl p-3 text-xs text-white focus:outline-none focus:border-sky-500 cursor-pointer shadow-lg">
                <option value="">-- Hippodrome --</option>
            </select>
            <select id="raceSelect" onchange="onRaceChange()" class="w-full bg-zinc-900 border border-zinc-800 rounded-xl p-3 text-xs text-white focus:outline-none focus:border-sky-500 cursor-pointer shadow-lg">
                <option value="">-- Course --</option>
            </select>
        </div>

        <!-- BARRE NAVIGATION -->
        <div class="flex flex-wrap justify-between items-center gap-2 bg-zinc-900/80 border border-zinc-800 rounded-xl px-3.5 py-2.5">
            <span class="text-[11px] text-zinc-400 font-semibold flex items-center">
                <i class="fa-solid fa-crosshairs mr-1.5 text-sky-400"></i> Scan en temps réel
            </span>
            <div class="flex items-center space-x-2">
                <button onclick="fetchRaceData()" class="bg-sky-900/40 hover:bg-sky-600 text-sky-300 text-[11px] px-3 py-1.5 rounded-lg border border-sky-500/40 font-bold transition flex items-center shadow cursor-pointer">
                    <i class="fa-solid fa-satellite-dish mr-1.5"></i> Scanner
                </button>
                <div class="flex items-center bg-zinc-800 rounded-lg border border-zinc-700 overflow-hidden shadow">
                    <button onclick="navigateRace(-1)" class="px-3 py-1.5 text-zinc-400 hover:text-white hover:bg-zinc-700 transition cursor-pointer border-r border-zinc-700" title="Course précédente">
                        <i class="fa-solid fa-chevron-left text-[10px]"></i>
                    </button>
                    <button onclick="navigateRace(1)" class="px-3 py-1.5 text-zinc-400 hover:text-white hover:bg-zinc-700 transition cursor-pointer" title="Course suivante">
                        <i class="fa-solid fa-chevron-right text-[10px]"></i>
                    </button>
                </div>
            </div>
        </div>

        <!-- BLOC ARRIVÉE OFFICIELLE -->
        <div id="arrivalBlock" class="hidden bg-blue-950/40 border border-blue-500/40 rounded-xl p-3.5 space-y-2 mt-2 shadow-lg shadow-blue-900/20">
            <div class="flex justify-between items-center">
                <h2 class="text-xs font-bold uppercase text-blue-400 tracking-wider flex items-center">
                    <i class="fa-solid fa-flag-checkered mr-1.5"></i> Arrivée Officielle
                </h2>
            </div>
            <div id="arrivalList" class="flex flex-wrap gap-2 text-xs font-bold text-white"></div>
            <div id="reportsGrid" class="hidden grid grid-cols-2 sm:grid-cols-4 gap-2 mt-2 pt-2 border-t border-blue-500/30"></div>
        </div>

        <!-- TABLEAU SCREENER COMPLET -->
        <div class="bg-zinc-900 border border-zinc-800 rounded-2xl overflow-hidden text-xs shadow-xl mt-2">
            <div id="raceInfoDetails" class="p-3 border-b border-zinc-800 flex justify-between items-center bg-zinc-800/30">
                <!-- Rempli dynamiquement -->
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-left">
                    <thead>
                        <tr class="bg-zinc-950 text-zinc-400 border-b border-zinc-800">
                            <th class="p-3">N° / Cheval</th>
                            <th class="p-3 text-center">Score <span class="text-[9px] block text-zinc-500">Musique</span></th>
                            <th class="p-3 text-center">Matin ➝ Direct</th>
                            <th class="p-3 text-right">Alerte IA</th>
                        </tr>
                    </thead>
                    <tbody id="runnersTableBody" class="divide-y divide-zinc-800/50">
                        <tr><td colspan="4" class="p-8 text-center text-zinc-500 font-mono text-xs"><i class="fa-solid fa-satellite-dish mr-2"></i>En attente de scan...</td></tr>
                    </tbody>
                </table>
            </div>
            <div class="p-3 bg-zinc-950 border-t border-zinc-800 text-[9px] text-zinc-500 flex justify-between">
                <span>🔥 Smart Money (Baisse suspecte)</span>
                <span>🟢 Value Oubliée (Gros score, bonne cote)</span>
                <span>🔴 Danger (Surjoué)</span>
            </div>
        </div>
    </main>

    <script>
        let currentDisciplineMode = 'GALOP'; 
        let liveMeetingsData = [];
        let pollingInterval = null;

        function isRaceFinished(c) {
            let st = String(c.statut || "").toUpperCase();
            return st.includes('FIN') || st.includes('ARRIV') || st.includes('ANNUL');
        }

        function isRaceStarted(race, partants = []) {
            let st = String(race?.statut || "").toUpperCase();
            if (st.includes('EN_COUR') || st.includes('COURSE') || st.includes('PARTI') || st.includes('FIN') || st.includes('ARRIV')) {
                return true;
            }
            if (race?.heureDepart) {
                let dep = new Date(race.heureDepart).getTime();
                if (!isNaN(dep) && Date.now() >= dep) return true;
            }
            if (partants.some(p => p.ordreArrivee && p.ordreArrivee > 0 && p.ordreArrivee < 20)) {
                return true;
            }
            return false;
        }

        function getLocalDateString(d = new Date()) {
            return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
        }

        function formatTime(timeValue) {
            if (!timeValue) return '';
            if (typeof timeValue === 'number') {
                const date = new Date(timeValue);
                const h = String(date.getHours()).padStart(2, '0');
                const m = String(date.getMinutes()).padStart(2, '0');
                return `${h}h${m}`;
            }
            return String(timeValue);
        }

        function getDisciplineBadge(discipline) {
            let d = String(discipline || 'PLAT').toUpperCase();
            if (d.includes('TROT') || d.includes('ATTEL') || d.includes('MONTE')) {
                return '<span class="bg-amber-500/20 text-amber-400 border border-amber-500/40 px-1.5 py-0.5 rounded text-[9px] font-black uppercase tracking-wider ml-2">TROT</span>';
            }
            if (d.includes('HAIES') || d.includes('STEEPLE') || d.includes('OBSTACLE') || d.includes('CROSS')) {
                return '<span class="bg-blue-500/20 text-blue-400 border border-blue-500/40 px-1.5 py-0.5 rounded text-[9px] font-black uppercase tracking-wider ml-2">OBSTACLE</span>';
            }
            return '<span class="bg-sky-500/20 text-sky-400 border border-sky-500/40 px-1.5 py-0.5 rounded text-[9px] font-black uppercase tracking-wider ml-2">PLAT</span>';
        }

        function matchesDisciplineFilter(course, mode) {
            if (mode === 'ALL') return true;
            let dStr = String(course?.discipline || '').toUpperCase();
            let sStr = String(course?.specialite || '').toUpperCase();
            let combined = `${dStr} ${sStr}`;
            let isTrot = combined.includes('TROT') || combined.includes('ATTEL') || combined.includes('MONTE');
            if (mode === 'TROT') return isTrot;
            if (mode === 'GALOP') {
                if (isTrot) return false;
                if (combined.includes('PLAT') || combined.includes('OBSTACLE') || combined.includes('HAIES') || combined.includes('STEEPLE') || combined.includes('CROSS') || combined.includes('GALOP')) return true;
                return dStr === '' || dStr === 'UNDEFINED';
            }
            return true;
        }

        function setDisciplineMode(mode) {
            currentDisciplineMode = mode;
            let btnGalop = document.getElementById('btnFilterGalop');
            let btnTrot = document.getElementById('btnFilterTrot');
            let btnAll = document.getElementById('btnFilterAll');
            
            let activeClass = "bg-sky-600 text-white px-3 py-1.5 rounded-lg font-black transition shadow cursor-pointer";
            let inactiveClass = "bg-zinc-800 text-zinc-400 hover:text-white px-3 py-1.5 rounded-lg font-bold transition cursor-pointer";
            
            if (btnGalop) btnGalop.className = inactiveClass;
            if (btnTrot) btnTrot.className = inactiveClass;
            if (btnAll) btnAll.className = inactiveClass;

            if (mode === 'GALOP' && btnGalop) btnGalop.className = activeClass;
            else if (mode === 'TROT' && btnTrot) btnTrot.className = activeClass;
            else if (btnAll) btnAll.className = activeClass;

            document.getElementById('meetingSelect').value = "";
            document.getElementById('raceSelect').innerHTML = '<option value="">-- Course --</option>';
            document.getElementById('runnersTableBody').innerHTML = '<tr><td colspan="4" class="p-8 text-center text-zinc-500 font-mono text-xs">En attente de scan...</td></tr>';
            loadLivePmu();
        }

        function onDateChange() {
            document.getElementById('meetingSelect').value = "";
            document.getElementById('raceSelect').innerHTML = '<option value="">-- Course --</option>';
            document.getElementById('runnersTableBody').innerHTML = '<tr><td colspan="4" class="p-8 text-center text-zinc-500 font-mono text-xs">En attente de scan...</td></tr>';
            loadLivePmu();
        }

        function onMeetingChange() {
            let mIdx = document.getElementById('meetingSelect').value;
            let raceSelect = document.getElementById('raceSelect');
            raceSelect.innerHTML = '<option value="">-- Choisissez une course --</option>';
            if (mIdx === "" || !liveMeetingsData[mIdx]) return;

            liveMeetingsData[mIdx].courses.forEach((c, idx) => {
                let opt = document.createElement('option');
                opt.value = idx;
                let courseTime = c.heureDepart ? `[${formatTime(c.heureDepart)}] ` : '';
                let statusMarker = isRaceFinished(c) ? '🏁 ' : '';
                let cNum = c.numOrdre || (idx + 1);
                opt.textContent = `${statusMarker}${courseTime}C${cNum} - ${c.libelle || c.nom || 'Course'}`;
                raceSelect.appendChild(opt);
            });
        }

        function onRaceChange() {
            fetchRaceData();
        }

        function resetAllCache() {
            loadLivePmu();
        }

        // ==========================================
        //  MOTEUR SCREENER V27
        // ==========================================

        function getCoteSafely(p) {
            let raw = p.dernierRapportDirect?.rapport || p.probabiliteEvolution || "999.9";
            let c = parseFloat(String(raw).replace(',', '.'));
            return (isNaN(c) || c <= 1.0) ? 999.9 : c;
        }

        function evaluateMusiqueScreener(musique) {
            if (!musique) return 0;
            let clean = String(musique).replace(/\(\d+\)/g, '');
            let tokens = clean.match(/([0-9DATR]+)([a-zA-Z]+)/g) || [];
            if (tokens.length === 0) return 0;

            let score = 0;
            for (let i = 0; i < Math.min(tokens.length, 5); i++) {
                let matchRes = tokens[i].match(/^([0-9DATR]+)/i);
                let res = matchRes ? matchRes[1].toUpperCase() : '9';
                let w = (5 - i); // Dégressif 5, 4, 3, 2, 1
                
                if (res === '1') score += 10 * w;
                else if (res === '2') score += 8 * w;
                else if (res === '3') score += 6 * w;
                else if (res === '4') score += 4 * w;
                else if (res === '5') score += 2 * w;
                else if (res === '0' || res.includes('D') || res.includes('A')) score -= 2 * w; 
            }
            return Math.max(0, Math.min(100, Math.round((score / 150) * 100)));
        }

        function computeScreener(partants) {
            let validPartants = partants.filter(p => !String(p.statut || "PARTANT").toUpperCase().includes("NON_PARTANT"));

            let processed = validPartants.map(p => {
                let num = parseInt(p.numPmu || p.numOrdre, 10);
                let coteDir = getCoteSafely(p);
                let rawMatin = p.dernierRapportReference?.rapport || coteDir;
                let coteMatin = parseFloat(String(rawMatin).replace(',', '.')) || coteDir;

                let score = evaluateMusiqueScreener(p.musique || p.form);
                
                // Calcul de la chute (Drop Ratio)
                let dropPct = 0;
                if (coteMatin > 1 && coteDir < 900) {
                    dropPct = ((coteMatin - coteDir) / coteMatin) * 100;
                }

                // Définition de l'Alerte
                let alertHtml = `<span class="text-zinc-600 font-mono text-[10px]">Normal</span>`;
                let sortWeight = 0;

                // 1. SMART MONEY (Baisse de plus de 25% + cote direct < 15)
                if (dropPct >= 25 && coteDir <= 15) {
                    alertHtml = `<span class="bg-orange-500/20 text-orange-400 border border-orange-500/40 px-2 py-0.5 rounded font-black text-[10px] animate-pulse">🔥 MONEY</span>`;
                    sortWeight = 3;
                }
                // 2. VALUE OUBLIEE (Score > 60 + Cote > 8.0 + Baisse < 10%)
                else if (score >= 60 && coteDir >= 8.0 && dropPct < 10) {
                    alertHtml = `<span class="bg-emerald-500/20 text-emerald-400 border border-emerald-500/40 px-2 py-0.5 rounded font-black text-[10px]">🟢 VALUE</span>`;
                    sortWeight = 2;
                }
                // 3. SURJOUÉ / DANGER (Score < 30 + Cote < 4.0)
                else if (score <= 30 && coteDir < 4.0) {
                    alertHtml = `<span class="bg-red-500/20 text-red-400 border border-red-500/40 px-2 py-0.5 rounded font-black text-[10px]">🔴 DANGER</span>`;
                    sortWeight = 1;
                }

                return {
                    num, nom: p.nom || "Cheval", musique: p.musique || "Inédit",
                    coteDisplay: coteDir < 900 ? coteDir.toFixed(1) : "--",
                    coteMatinDisplay: coteMatin < 900 ? coteMatin.toFixed(1) : "--",
                    dropPct, score, alertHtml, sortWeight,
                    ordreArrivee: p.ordreArrivee ? parseInt(p.ordreArrivee, 10) : 0
                };
            });

            // Tri : Les alertes en haut, puis par score
            processed.sort((a, b) => {
                if (b.sortWeight !== a.sortWeight) return b.sortWeight - a.sortWeight;
                return b.score - a.score;
            });

            return processed;
        }

        async function fetchRaceData() {
            let mIdx = document.getElementById('meetingSelect').value;
            let cIdx = document.getElementById('raceSelect').value;
            if (mIdx === "" || cIdx === "") return;
            
            let meeting = liveMeetingsData[mIdx];
            let race = meeting?.courses?.[cIdx];
            if (!meeting || !race) return;

            let dateInput = document.getElementById('raceDate').value;
            let parts = dateInput.split('-');
            let ddmmyyyy = `${parts[2]}${parts[1]}${parts[0]}`;
            
            let rNum = meeting.numOfficiel || (parseInt(mIdx, 10) + 1);
            let cNum = race.numOrdre || (parseInt(cIdx, 10) + 1);
            
            document.getElementById('runnersTableBody').innerHTML = `<tr><td colspan="4" class="p-8 text-center text-sky-500 font-mono"><i class="fa-solid fa-spinner fa-spin mr-2"></i>Scan en cours...</td></tr>`;
            document.getElementById('arrivalBlock').classList.add('hidden');

            try {
                const res = await fetch(`/api/courses?date=${ddmmyyyy}&r=${rNum}&c=${cNum}&_t=${Date.now()}`);
                const data = await res.json();
                let partants = data.participants || [];
                
                let hipName = meeting.hippodrome?.libelleLong || meeting.hippodrome?.libelleCourt || meeting.hippodrome?.nom || 'Hippodrome';
                let cStart = race.heureDepart ? formatTime(race.heureDepart) : '';
                
                let arrivees = partants.filter(p => p.ordreArrivee && p.ordreArrivee > 0 && p.ordreArrivee < 20).sort((a,b) => a.ordreArrivee - b.ordreArrivee);
                let isStarted = isRaceStarted(race, partants);
                let hasArrival = arrivees.length > 0;

                let runningBadge = (isStarted && !hasArrival)
                    ? '<span class="bg-red-500/20 text-red-400 border border-red-500/40 px-2 py-0.5 rounded text-[9px] font-black uppercase tracking-wider ml-2 animate-pulse"><i class="fa-solid fa-horse-head mr-1"></i>EN COURSE</span>'
                    : '';

                document.getElementById('raceInfoDetails').innerHTML = `<div class="flex items-center flex-wrap"><span class="text-sky-400 font-black text-sm">R${rNum}C${cNum}</span><span class="text-zinc-400 font-mono text-[11px] mx-1.5"><i class="fa-regular fa-clock"></i> ${cStart}</span><span class="text-zinc-300 font-semibold mr-1">- ${hipName}</span>${getDisciplineBadge(race.discipline)}${runningBadge}</div><div class="text-[10px] text-zinc-500 font-mono hidden sm:block">${partants.length} partants</div>`;

                let tbody = document.getElementById('runnersTableBody');
                
                if (hasArrival) {
                    let arrivalBlock = document.getElementById('arrivalBlock');
                    let arrivalList = document.getElementById('arrivalList');
                    let reportsGrid = document.getElementById('reportsGrid');
                    
                    arrivalBlock.classList.remove('hidden');
                    arrivalList.innerHTML = arrivees.slice(0, 5).map(p => 
                        `<div class="bg-blue-900/60 px-2.5 py-1 rounded-lg border border-blue-500/40"><span class="text-blue-300">${p.ordreArrivee}e:</span> N°${p.numPmu || p.numOrdre} ${p.nom}</div>`
                    ).join('');

                    let listeRapports = Array.isArray(data.rapports) ? data.rapports : (data.rapports?.lesRapports || data.rapports?.rapports || []);
                    let reportsHTML = "";
                    
                    listeRapports.forEach(group => {
                        let pType = String(group.typePari || group.libellePari || group.codePari || "").toUpperCase();
                        let famille = String(group.famillePari || "").toUpperCase();
                        
                        if (pType.includes('SIMPLE') || pType.includes('SG') || pType.includes('SP') || famille.includes('SIMPLE')) {
                            let details = group.rapports || group.dividendes || group.lesRapports || [];
                            details.forEach(item => {
                                let combo = String(item.combinaison || item.cheval || item.numeroCheval || item.partant || "").trim();
                                let lib = String(item.libelleRapport || item.libelle || item.typeRapport || item.nomRapport || "").toUpperCase();
                                
                                let val = item.dividendePourUnEuro !== undefined ? item.dividendePourUnEuro / 100 : (item.dividendeEuro !== undefined ? item.dividendeEuro : 0);
                                if (val > 0) {
                                    let typeBadge = 'P';
                                    if (lib.includes('GAGNANT') || lib === 'G' || lib.includes('SG') || lib.includes('1ER') || pType.includes('GAGNANT') || pType === 'SG') typeBadge = 'G';
                                    let badgeColor = typeBadge === 'G' ? 'text-amber-400' : 'text-blue-400';
                                    reportsHTML += `<div class="bg-blue-900/40 p-1.5 rounded border border-blue-500/30 flex justify-between items-center text-[10px]">
                                        <span class="text-zinc-300">N°${combo} <span class="${badgeColor} font-black">${typeBadge}</span></span>
                                        <span class="text-white font-bold">${val.toFixed(2)}€</span>
                                    </div>`;
                                }
                            });
                        }
                    });

                    if (reportsHTML !== "") {
                        reportsGrid.innerHTML = reportsHTML;
                        reportsGrid.classList.remove('hidden');
                        reportsGrid.classList.add('grid');
                    }
                }

                let screenerData = computeScreener(partants);
                tbody.innerHTML = '';
                
                screenerData.forEach(p => {
                    let tr = document.createElement('tr');
                    tr.className = p.sortWeight > 0 ? "bg-sky-950/10 border-b border-zinc-800/50" : "border-b border-zinc-800/50 opacity-80";
                    
                    let dropColor = p.dropPct >= 20 ? "text-orange-400 font-bold" : (p.dropPct < -10 ? "text-red-400" : "text-zinc-400");
                    let dropStr = p.dropPct > 0 ? `-${p.dropPct.toFixed(0)}%` : (p.dropPct < 0 ? `+${Math.abs(p.dropPct).toFixed(0)}%` : `0%`);
                    
                    let tag = p.ordreArrivee ? `<span class="ml-2 text-[9px] bg-blue-500/20 text-blue-400 px-1.5 py-0.5 rounded font-bold">🏁 ${p.ordreArrivee}e</span>` : '';
                    let scoreColor = p.score >= 60 ? "text-emerald-400" : (p.score < 30 ? "text-red-400" : "text-zinc-300");

                    tr.innerHTML = `
                        <td class="p-3 font-bold"><span class="text-zinc-500 mr-2">${p.num}</span><span class="text-zinc-200">${p.nom}</span> <span class="block text-[9px] text-zinc-500 font-normal mt-0.5">${p.musique}</span>${tag}</td>
                        <td class="p-3 text-center font-black ${scoreColor} text-sm">${p.score}</td>
                        <td class="p-3 text-center text-xs"><span class="text-zinc-500">${p.coteMatinDisplay}</span> ➝ <span class="text-white font-bold">${p.coteDisplay}</span> <span class="block text-[10px] ${dropColor} mt-0.5">${dropStr}</span></td>
                        <td class="p-3 text-right">${p.alertHtml}</td>
                    `;
                    tbody.appendChild(tr);
                });

            } catch(e) {
                document.getElementById('runnersTableBody').innerHTML = `<tr><td colspan="4" class="p-6 text-center text-red-500">Erreur réseau : Vérifiez votre API locale.</td></tr>`;
            }
        }

        async function loadLivePmu() {
            let dateEl = document.getElementById('raceDate');
            if (!dateEl.value) {
                let today = new Date();
                dateEl.value = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}-${String(today.getDate()).padStart(2, '0')}`;
            }
            const dateInput = dateEl.value;
            const parts = dateInput.split('-');
            const ddmmyyyy = `${parts[2]}${parts[1]}${parts[0]}`;
            
            const statusText = document.getElementById('statusText');
            statusText.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-2"></i>Téléchargement via API Locale...';

            try {
                const res = await fetch(`/api/courses?date=${ddmmyyyy}&_t=${Date.now()}`);
                const data = await res.json();
                
                let rawReunions = data.programme?.reunions || data.reunions || data.programme?.lesReunions || [];
                liveMeetingsData = [];
                let totalCourses = 0;

                rawReunions.forEach((r, rIdx) => {
                    let targetCourses = (r.courses || []).filter(c => matchesDisciplineFilter(c, currentDisciplineMode));
                    if (targetCourses.length > 0) {
                        let rCopy = { ...r, courses: targetCourses };
                        liveMeetingsData.push(rCopy);
                        totalCourses += targetCourses.length;
                    }
                });
                
                if (liveMeetingsData.length > 0) {
                    let select = document.getElementById('meetingSelect');
                    select.innerHTML = '<option value="">-- Choisissez un hippodrome --</option>';

                    liveMeetingsData.forEach((r, idx) => {
                        let opt = document.createElement('option');
                        opt.value = idx;
                        let hipName = r.hippodrome?.libelleLong || r.hippodrome?.libelleCourt || r.hippodrome?.nom || 'Hippodrome';
                        opt.textContent = `R${r.numOfficiel || (idx+1)} - ${hipName} (${r.courses.length} courses)`;
                        select.appendChild(opt);
                    });
                    
                    statusText.innerHTML = `<span class="text-sky-400 font-semibold"><i class="fa-solid fa-satellite-dish mr-1"></i> Radar Actif (${liveMeetingsData.length} réunions | ${totalCourses} courses)</span>`;
                    
                    document.getElementById('meetingSelect').value = "0";
                    onMeetingChange();
                    document.getElementById('raceSelect').value = "0";
                    fetchRaceData();

                } else {
                    document.getElementById('meetingSelect').innerHTML = '<option value="">Aucune réunion</option>';
                    document.getElementById('runnersTableBody').innerHTML = '<tr><td colspan="4" class="p-6 text-center text-zinc-500">Aucune course au programme.</td></tr>';
                    statusText.innerHTML = `<span class="text-zinc-400">Aucune réunion au programme.</span>`;
                }
            } catch (e) {
                statusText.innerHTML = `<span class="text-red-400 font-semibold"><i class="fa-solid fa-triangle-exclamation mr-1"></i> Erreur API Locale</span>`;
            }
        }

        function getSortedRacesList() {
            let list = [];
            liveMeetingsData.forEach((m, mIdx) => {
                m.courses.forEach((c, cIdx) => {
                    if (c.heureDepart) list.push({ mIdx, cIdx, time: new Date(c.heureDepart).getTime() });
                });
            });
            return list.sort((a, b) => a.time - b.time);
        }

        function navigateRace(direction) {
            let mIdx = parseInt(document.getElementById('meetingSelect').value, 10);
            let cIdx = parseInt(document.getElementById('raceSelect').value, 10);
            if (isNaN(mIdx) || isNaN(cIdx)) return;

            let sortedRaces = getSortedRacesList();
            let currentIndex = sortedRaces.findIndex(r => r.mIdx === mIdx && r.cIdx === cIdx);

            if (currentIndex !== -1 && sortedRaces[currentIndex + direction]) {
                let targetRace = sortedRaces[currentIndex + direction];
                document.getElementById('meetingSelect').value = targetRace.mIdx;
                onMeetingChange();
                document.getElementById('raceSelect').value = targetRace.cIdx;
                fetchRaceData();
            }
        }

        window.onload = () => { 
            let dateEl = document.getElementById('raceDate');
            if (!dateEl.value) {
                let today = new Date();
                dateEl.value = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}-${String(today.getDate()).padStart(2, '0')}`;
            }
            loadLivePmu(); 
        };
    </script>
</body>
</html>
